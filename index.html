<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHE Vehicle Reservation</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #00563F;
      --green-mid:   #6C8D13;
      --green-light: #e8f4ee;
      --blue-mid:    #2A7BAE;
      --blue-light:  #e8f4f8;
      --amber:       #f39c12;
      --amber-light: #fff4e6;
      --red:         #c41717;
      --red-light:   #ffecec;
      --gray-100:    #f4f4f4;
      --gray-200:    #e0e0e0;
      --gray-400:    #999;
      --gray-600:    #555;
      --text:        #1a1a1a;
      --border:      #d0d0d0;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--text);
      background: #f7f8f5;
      font-size: 15px;
      line-height: 1.5;
    }

    /* MAIN WRAPPER */
    .page-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }

    /* CALENDAR CARD */
    .calendar-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--gray-200);
    }
    .calendar-nav h2 {
      font-size: clamp(15px, 3.5vw, 18px);
      font-weight: 700;
      color: var(--green-dark);
    }
    .nav-btn {
      background: none;
      border: 1.5px solid var(--green-mid);
      color: var(--green-mid);
      border-radius: var(--radius-sm);
      width: 34px;
      height: 34px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      line-height: 1;
    }
    .nav-btn:hover { background: var(--green-light); }

    #calendar { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #calendar th {
      background: var(--gray-100);
      font-size: clamp(10px, 2vw, 13px);
      font-weight: 700;
      color: var(--gray-600);
      padding: 8px 2px;
      text-align: center;
      border-bottom: 1px solid var(--gray-200);
    }
    #calendar td {
      border: 1px solid var(--gray-200);
      text-align: center;
      vertical-align: top;
      cursor: pointer;
      transition: background 0.1s;
      padding: 0;
      width: 14.28%;
      height: 60px;
      max-height: 60px;
      overflow: hidden;
    }
    .cell-inner {
      width: 100%;
      height: 60px;
      max-height: 60px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 3px 3px;
      box-sizing: border-box;
    }
    .cell-day {
      font-size: clamp(12px, 2.5vw, 14px);
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      flex-shrink: 0;
    }
    #calendar td:hover:not(.disabled) { background: #eef6ee; }
    #calendar td.today { background: #d1ffd1; }
    #calendar td.today .cell-day { color: var(--green-dark); }
    #calendar td.disabled {
      background: var(--gray-100);
      pointer-events: none;
      cursor: not-allowed;
    }
    #calendar td.disabled .cell-day { color: var(--gray-400); }
    .holiday-note {
      font-size: 8px;
      color: #b00;
      line-height: 1.2;
      margin-top: 3px;
      font-weight: 400;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      max-width: 100%;
      padding: 0 2px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      padding: 12px;
      overflow-y: auto;
    }
    .modal.is-open { display: block; }
    @media (min-width: 600px) {
      .modal.is-open {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px;
      }
    }
    .modal-content {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 20px 28px;
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 700;
      color: var(--green-dark);
      line-height: 1.3;
    }
    .close-btn {
      background: var(--gray-100);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 20px;
      cursor: pointer;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .close-btn:hover { background: var(--gray-200); }

    /* RESERVATION MODAL — landscape on tablet/desktop, stacked on phones */
    @media (min-width: 768px) {
      .modal-content--wide {
        max-width: 1040px;
        height: calc(100vh - 48px);
        max-height: 820px;
        display: flex;
        flex-direction: column;
        padding: 20px 0 0;
        overflow: hidden;
      }
      .modal.is-open:has(.modal-content--wide) {
        align-items: center;
        padding: 24px;
      }
      .modal-content--wide .modal-header {
        padding: 0 24px 14px;
        margin-bottom: 0;
        border-bottom: 1px solid var(--gray-200);
      }
      .modal-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(260px, 34%) 1fr;
      }
      .modal-body > hr.divider { display: none; }
      .modal-pane {
        overflow-y: auto;
        padding: 18px 24px 24px;
        overscroll-behavior: contain;
      }
      .modal-pane--schedule {
        background: var(--gray-100);
        border-right: 1px solid var(--gray-200);
      }
      .form-row.wide-two-col { grid-template-columns: 1fr 1fr; }
      .modal-pane--form .submit-btn {
        position: sticky;
        bottom: 0;
        box-shadow: 0 -12px 16px -8px #fff;
      }
    }

    /* SCHEDULE SLOTS */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gray-400);
      margin-bottom: 8px;
    }
    .slot-box {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .slot-time { font-weight: 700; font-size: 14px; }
    .slot-meta { color: var(--gray-600); margin-top: 2px; }
    .slot-status { font-size: 11px; margin-top: 3px; opacity: 0.8; }

    .Reservation.approved   { background: var(--green-dark); color: #fff; border-color: #004733; }
    .Reservation.approved .slot-meta,
    .Reservation.approved .slot-status { color: rgba(255,255,255,0.8); }
    .Reservation.pencilbooked { background: #fafafa; color: #aaa; border-color: #ddd; }

    .DeanSched.approved   { background: var(--green-mid); color: #fff; border-color: #557010; }
    .DeanSched.approved .slot-meta,
    .DeanSched.approved .slot-status { color: rgba(255,255,255,0.8); }
    .DeanSched.pencilbooked { background: #fdf7e3; color: #a17f00; border-color: #d1a400; }
    .DeanSched.scheduled  { background: #134f8d; color: #fff; border-color: #0f3f6f; }
    .DeanSched.scheduled .slot-meta,
    .DeanSched.scheduled .slot-status { color: rgba(255,255,255,0.8); }
    .DeanSched.cancelled  { background: var(--red-light); color: var(--red); border-color: var(--red); }

    hr.divider { border: none; border-top: 1px dashed var(--border); margin: 16px 0; }

    /* FORM */
    .form-section-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .form-hint-bar {
      background: var(--amber-light);
      border-left: 3px solid var(--amber);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      font-size: 12px;
      color: #7a4f00;
      margin-bottom: 14px;
    }
    .form-row { display: grid; gap: 10px; margin-bottom: 10px; }
    .form-row.two-col { grid-template-columns: 1fr 1fr; }
    @media (max-width: 320px) { .form-row.two-col { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input,
    .form-group select {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: 'Lato', sans-serif;
      color: var(--text);
      background: #fff;
      width: 100%;
      transition: border-color 0.15s;
      min-height: 48px;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--green-mid);
      box-shadow: 0 0 0 3px rgba(108,141,19,0.12);
    }
    .field-warning { font-size: 12px; color: var(--red); display: none; margin-top: 3px; }

    /* PASSENGER ROWS */
    .passenger-section {
      background: var(--gray-100);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 10px;
    }
    .passenger-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-600);
      margin-bottom: 8px;
    }
    .passenger-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    @media (max-width: 400px) {
      .passenger-row { grid-template-columns: 1fr auto; }
      .passenger-row .p-email { grid-column: 1; }
    }
    .passenger-row input {
      padding: 9px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: 'Lato', sans-serif;
      color: var(--text);
      background: #fff;
      width: 100%;
    }
    .passenger-row input:focus {
      outline: none;
      border-color: var(--green-mid);
    }
    .remove-btn {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      width: 32px;
      height: 32px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .remove-btn:hover { background: #a00; }
    .add-passenger-btn {
      background: none;
      border: 1.5px dashed var(--green-mid);
      color: var(--green-mid);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .add-passenger-btn:hover { background: var(--green-light); }

    /* INLINE ERROR */
    .inline-error {
      background: var(--red-light);
      border: 1px solid #ffb3b3;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 12px;
      display: none;
    }
    .inline-error strong { color: #a00; }

    /* SUBMIT BUTTON */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--green-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      cursor: pointer;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      transition: background 0.15s;
    }
    .submit-btn:disabled { background: #b0b0b0; cursor: not-allowed; }
    .submit-btn:not(:disabled):hover { background: #004733; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CONFIRMATION */
    .confirm-title {
      text-align: center;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 6px;
    }
    .confirm-sub { text-align: center; font-size: 13px; color: var(--gray-600); margin-bottom: 4px; }
    .confirm-code {
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 700;
      color: var(--green-dark);
      background: var(--green-light);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      margin: 14px 0;
      letter-spacing: 0.05em;
    }
    .confirm-ref {
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 14px;
    }

    /* SKELETON */
    .skeleton-bar {
      height: 13px;
      background: linear-gradient(90deg, var(--gray-200) 25%, var(--gray-100) 50%, var(--gray-200) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .page-footer {
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      padding: 16px;
    }
  </style>
</head>
<body>

  <main class="page-body">
    <div class="calendar-card">
      <div class="calendar-nav">
        <button class="nav-btn" onclick="prevMonth()" aria-label="Previous month">&#8249;</button>
        <h2 id="monthYear"></h2>
        <button class="nav-btn" onclick="nextMonth()" aria-label="Next month">&#8250;</button>
      </div>
      <table id="calendar" role="grid" aria-label="Reservation calendar">
        <thead><tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer class="page-footer">Tap a date to view schedules or make a reservation.</footer>

  <!-- RESERVATION MODAL -->
  <div id="reservationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content modal-content--wide">
      <div class="modal-header">
        <h3 id="modalTitle">Details</h3>
        <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
      <section class="modal-pane modal-pane--schedule">
      <p class="section-label">Reservations</p>
      <div id="existingList">
        <div class="skeleton-bar" style="width:70%"></div>
        <div class="skeleton-bar" style="width:50%"></div>
      </div>
      </section>

      <hr class="divider">

      <section class="modal-pane modal-pane--form">
      <p class="form-section-title">Reserve the college vehicle</p>
      <div class="form-hint-bar">
        <strong>Note:</strong> Units are responsible for the driver&rsquo;s TEV and college vehicle&rsquo;s fuel expenses for the duration of the trip.
      </div>

      <div id="duplicateError" class="inline-error"></div>

      <form id="reservationForm" novalidate>
        <input type="hidden" id="resDate">

        <div class="form-row two-col">
          <div class="form-group">
            <label for="startTime">Start time</label>
            <input type="time" id="startTime" required>
            <span id="timeWarning" class="field-warning"></span>
          </div>
          <div class="form-group">
            <label for="endTime">End time</label>
            <input type="time" id="endTime" required>
          </div>
        </div>

        <div class="form-row wide-two-col">
          <div class="form-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" placeholder="e.g. UPLB Main Gate" required>
          </div>
          <div class="form-group">
            <label for="purpose">Purpose</label>
            <input type="text" id="purpose" placeholder="e.g. Field visit" required>
          </div>
        </div>

        <div class="form-row wide-two-col">
          <div class="form-group">
            <label for="unit">Requesting unit</label>
            <select id="unit" required>
              <option value="" selected disabled>Select a unit</option>
              <option>CHE DO</option>
              <option>DCERP</option>
              <option>DHFDS</option>
              <option>DSDS</option>
              <option>IHNF</option>
              <option>BIDANI</option>
              <option>Project</option>
            </select>
          </div>
          <div class="form-group">
            <label for="vehicle">Vehicle</label>
            <select id="vehicle" required>
              <option value="">Loading vehicles…</option>
            </select>
          </div>
        </div>

        <div class="form-row two-col" id="projectFields" style="display:none;">
          <div class="form-group">
            <label for="projectTitle">Project title</label>
            <input type="text" id="projectTitle" placeholder="e.g. Nutrition Survey 2026">
          </div>
          <div class="form-group">
            <label for="agencyFunder">Agency funder</label>
            <input type="text" id="agencyFunder" placeholder="e.g. DOST-PCHRD">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="remarks">Remarks</label>
            <input type="text" id="remarks" placeholder="Optional">
          </div>
        </div>

        <div class="passenger-section">
          <p class="passenger-section-title">Passengers</p>
          <div id="passengersContainer"></div>
          <button type="button" class="add-passenger-btn" onclick="addPassenger()">+ Add passenger</button>
        </div>

        <div class="form-section-title" style="margin-top:12px;">Main requestor</div>
        <div class="form-row two-col" style="margin-top:8px;">
          <div class="form-group">
            <label for="mainRequestor">Name</label>
            <input type="text" id="mainRequestor" placeholder="Juan dela Cruz" required>
          </div>
          <div class="form-group">
            <label for="mainEmail">Email</label>
            <input type="email" id="mainEmail" placeholder="juan@up.edu.ph" required>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span id="submitText">Submit reservation</span>
          <span class="spinner" id="loadingSpinner"></span>
        </button>
      </form>
      </section>
      </div>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirmationModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header" style="justify-content: flex-end;">
        <button class="close-btn" id="closeConfirmation" aria-label="Close">&times;</button>
      </div>
      <div id="confirmationMessage"></div>
    </div>
  </div>

  <!-- ERROR MODAL -->
  <div id="errorModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color: var(--red);">Something went wrong</h3>
        <button class="close-btn" id="closeError" aria-label="Close">&times;</button>
      </div>
      <p id="errorMessage" style="font-size:14px; color:var(--gray-600);"></p>
    </div>
  </div>

  <script>
    // ============================================================
    // PASTE YOUR GAS DEPLOYMENT URL HERE
    // ============================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxzEfUuIC9Es0KyIbRboI2sshhUouWh2eHUDDX5Xi_91tZQiPznGzMrjaszxlWf1Xgj/exec";

    async function api(action, params = {}) {
      const url = new URL(GAS_URL);
      url.searchParams.set("action", action);
      for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
      const res = await fetch(url.toString());
      if (!res.ok) throw new Error(`Network error: ${res.status}`);
      return res.json();
    }

    let holidaysMap = {};
    let currentDate = new Date();
    let isSubmitting = false;

    window.onload = async () => {
      addPassenger();

      ["startTime","endTime"].forEach(id => {
        document.getElementById(id).addEventListener("input", validateTimes);
        document.getElementById(id).addEventListener("change", validateTimes);
      });

      document.getElementById("unit").addEventListener("change", toggleProjectFields);

      document.getElementById("closeConfirmation").onclick = () =>
        document.getElementById("confirmationModal").classList.remove("is-open");
      document.getElementById("closeError").onclick = closeErrorModal;

      document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        closeModal();
        closeErrorModal();
        document.getElementById("confirmationModal").classList.remove("is-open");
      });

      window.onclick = e => {
        ["reservationModal","confirmationModal","errorModal"].forEach(id => {
          if (e.target === document.getElementById(id)) {
            if (id === "reservationModal") closeModal();
            else document.getElementById(id).classList.remove("is-open");
          }
        });
      };

      renderCalendar(currentDate);

      try {
        const [holidays, vehicles] = await Promise.all([
          api("getHolidays"),
          api("getVehicles")
        ]);
        holidays.forEach(h => { holidaysMap[h.date] = h.name; });
        renderCalendar(currentDate);
        populateVehicleDropdown(vehicles);
      } catch (err) {
        console.error("Failed to load holidays/vehicles:", err);
      }
    };

    /* UNIT / PROJECT FIELDS */
    function toggleProjectFields() {
      const isProject = document.getElementById("unit").value === "Project";
      document.getElementById("projectFields").style.display = isProject ? "" : "none";
      ["projectTitle", "agencyFunder"].forEach(id => {
        const el = document.getElementById(id);
        el.required = isProject;
        if (!isProject) el.value = "";
      });
    }

    /* VEHICLE DROPDOWN */
    function populateVehicleDropdown(vehicles) {
      const sel = document.getElementById("vehicle");
      if (!vehicles || !vehicles.length) {
        sel.innerHTML = `<option value="">No vehicles available</option>`;
        return;
      }
      sel.innerHTML = `<option value="" selected disabled>Select a vehicle</option>` +
        vehicles.map(v => `<option value="${v.name}||${v.plate}">${v.name}${v.plate ? ` — ${v.plate}` : ""}</option>`).join("");
    }

    /* CALENDAR */
    function renderCalendar(date) {
      const month = date.getMonth(), year = date.getFullYear();
      const today = new Date();
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      document.getElementById("monthYear").textContent =
        date.toLocaleString("default", { month: "long", year: "numeric" });

      const tbody = document.querySelector("#calendar tbody");
      tbody.innerHTML = "";

      let row = document.createElement("tr");
      for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement("td"));

      for (let day = 1; day <= lastDate; day++) {
        if (row.children.length === 7) { tbody.appendChild(row); row = document.createElement("tr"); }
        const cell = document.createElement("td");
        const cellDate = new Date(year, month, day);
        const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const isSunday = cellDate.getDay() === 0;
        const holiday = holidaysMap[iso];
        const isPast = cellDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());

        const inner = document.createElement("div");
        inner.className = "cell-inner";
        const daySpan = document.createElement("span");
        daySpan.className = "cell-day";
        daySpan.textContent = day;
        inner.appendChild(daySpan);

        if (isPast || isSunday || holiday) {
          cell.classList.add("disabled");
          if (holiday) {
            const note = document.createElement("div");
            note.className = "holiday-note";
            note.textContent = holiday;
            inner.appendChild(note);
          }
        } else {
          cell.setAttribute("role", "button");
          cell.setAttribute("tabindex", "0");
          cell.onclick = () => openModal(year, month, day);
          cell.onkeydown = e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(year, month, day); }
          };
        }

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear())
          cell.classList.add("today");

        cell.appendChild(inner);
        row.appendChild(cell);
      }
      while (row.children.length < 7) row.appendChild(document.createElement("td"));
      tbody.appendChild(row);
    }

    function prevMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1); renderCalendar(currentDate); }
    function nextMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1); renderCalendar(currentDate); }

    /* MODAL */
    async function openModal(year, month, day) {
      const date = new Date(year, month, day);
      const formattedDate = date.toLocaleDateString("en-PH", { year:"numeric", month:"long", day:"numeric" });

      document.getElementById("modalTitle").textContent = `Details for ${formattedDate}`;
      document.getElementById("resDate").value = formattedDate;
      document.getElementById("existingList").innerHTML =
        `<div class="skeleton-bar" style="width:65%"></div><div class="skeleton-bar" style="width:45%"></div>`;
      document.getElementById("reservationModal").classList.add("is-open");
      document.body.style.overflow = "hidden";

      document.getElementById("reservationForm").reset();
      toggleProjectFields();
      document.querySelectorAll("#reservationModal, #reservationModal .modal-pane").forEach(el => el.scrollTop = 0);
      document.getElementById("passengersContainer").innerHTML = "";
      addPassenger();
      hideDuplicateError();
      enableSubmit();
      document.getElementById("timeWarning").style.display = "none";

      try {
        const list = await api("getSchedulesForDate", { date: formattedDate });

        if (!list || list.length === 0) {
          document.getElementById("existingList").innerHTML =
            `<p style="font-size:13px;color:var(--gray-400);font-style:italic;">No reservations yet.</p>`;
        } else {
          const filtered = list.filter(i => {
            if (i.type === "Reservation") {
              const st = (i.status || "").toLowerCase();
              return st === "pencil booked" || st === "approved";
            }
            return true;
          });

          const seen = new Set();
          const unique = filtered.filter(i => {
            if (i.code && seen.has(i.code)) return false;
            if (i.code) seen.add(i.code);
            return true;
          });

          if (!unique.length) {
            document.getElementById("existingList").innerHTML =
              `<p style="font-size:13px;color:var(--gray-400);font-style:italic;">No reservations yet.</p>`;
          } else {
            document.getElementById("existingList").innerHTML = unique.map(i => {
              const tc = i.type || "";
              const sc = (i.status || "").toLowerCase().replace(/\s+/g, "");
              return `<div class="slot-box ${tc} ${sc}">
                <div class="slot-time">${i.startTime} &ndash; ${i.endTime}</div>
                <div class="slot-meta"><b>Destination:</b> ${i.destination || "N/A"}</div>
                ${i.requestor ? `<div class="slot-meta"><b>Requestor:</b> ${i.requestor}</div>` : ""}
                ${i.remarks ? `<div class="slot-meta"><b>Remarks:</b> ${i.remarks}</div>` : ""}
                <div class="slot-status">Status: ${i.status}</div>
              </div>`;
            }).join("");
          }
        }
      } catch (err) {
        document.getElementById("existingList").innerHTML =
          `<p style="font-size:13px;color:var(--red);">Error loading schedules: ${err.message}</p>`;
      }
    }

    function closeModal() {
      document.getElementById("reservationModal").classList.remove("is-open");
      document.body.style.overflow = "";
    }
    function closeErrorModal() {
      document.getElementById("errorModal").classList.remove("is-open");
    }

    /* PASSENGERS */
    function addPassenger(name = "", email = "") {
      const c = document.getElementById("passengersContainer");
      const d = document.createElement("div");
      d.className = "passenger-row";
      d.innerHTML = `
        <input type="text" placeholder="Passenger name" value="${name}" required>
        <input type="email" placeholder="Passenger email" value="${email}" required class="p-email">
        <button type="button" class="remove-btn" onclick="this.parentElement.remove()" aria-label="Remove passenger">&#10006;</button>
      `;
      c.appendChild(d);
    }

    /* ERRORS */
    function showDuplicateError(message) {
      const el = document.getElementById("duplicateError");
      el.innerHTML = `<strong>Duplicate reservation detected</strong><br>${message}<br><br>
        <strong>If you think this is an error, please contact the administrator.</strong>`;
      el.style.display = "block";
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    function hideDuplicateError() { document.getElementById("duplicateError").style.display = "none"; }
    function showErrorModal(message) {
      document.getElementById("errorMessage").textContent = message;
      document.getElementById("errorModal").classList.add("is-open");
    }

    function enableSubmit() {
      document.getElementById("submitBtn").disabled = false;
      isSubmitting = false;
    }
    function showLoading() {
      isSubmitting = true;
      document.getElementById("submitText").textContent = "Submitting…";
      document.getElementById("loadingSpinner").style.display = "inline-block";
      document.getElementById("submitBtn").disabled = true;
    }
    function hideLoading() {
      isSubmitting = false;
      document.getElementById("submitText").textContent = "Submit reservation";
      document.getElementById("loadingSpinner").style.display = "none";
      document.getElementById("submitBtn").disabled = false;
    }

    /* VALIDATION */
    function validateTimes() {
      const s = document.getElementById("startTime").value;
      const e = document.getElementById("endTime").value;
      const warn = document.getElementById("timeWarning");
      const btn  = document.getElementById("submitBtn");

      warn.style.display = "none";
      btn.disabled = false;

      if (s && e) {
        const toMin = t => parseInt(t.split(":")[0]) * 60 + parseInt(t.split(":")[1]);
        const diff = toMin(e) - toMin(s);
        if (diff <= 0) {
          warn.textContent = "End time must be after start time";
          warn.style.display = "block";
          btn.disabled = true;
        } else if (diff < 30) {
          warn.textContent = "Minimum reservation is 30 minutes";
          warn.style.display = "block";
          btn.disabled = true;
        }
      }
    }

    function convert24to12(t) {
      let [h, m] = t.split(":").map(Number);
      const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
      return `${h}:${String(m).padStart(2,"0")} ${ap}`;
    }

    /* FORM SUBMIT */
    document.getElementById("reservationForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      if (isSubmitting) return;

      hideDuplicateError();

      const s = document.getElementById("startTime").value;
      const en = document.getElementById("endTime").value;

      if (!s || !en) { showErrorModal("Please enter both start and end times."); return; }
      const toMin = t => parseInt(t.split(":")[0]) * 60 + parseInt(t.split(":")[1]);
      const diff = toMin(en) - toMin(s);
      if (diff <= 0) { showErrorModal("Start time must be before end time."); return; }
      if (diff < 30)  { showErrorModal("Reservation must be at least 30 minutes."); return; }

      const vehicleSel = document.getElementById("vehicle");
      if (!vehicleSel.value) { showErrorModal("Please select a vehicle."); return; }
      const [vehicleName, vehiclePlate] = vehicleSel.value.split("||");

      const unit = document.getElementById("unit").value;
      if (!unit) { showErrorModal("Please select the requesting unit."); return; }
      const projectTitle = document.getElementById("projectTitle").value.trim();
      const agencyFunder = document.getElementById("agencyFunder").value.trim();
      if (unit === "Project" && (!projectTitle || !agencyFunder)) {
        showErrorModal("Please enter the project title and agency funder.");
        return;
      }

      const rows = document.querySelectorAll("#passengersContainer .passenger-row");
      if (!rows.length) { showErrorModal("Please add at least one passenger."); return; }

      const passengers = [];
      let valid = true;
      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        const name = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        if (!name || !email) { valid = false; return; }
        passengers.push({ name, email });
      });
      if (!valid) { showErrorModal("Please fill in all passenger fields."); return; }

      const data = {
        date: document.getElementById("resDate").value,
        startTime: convert24to12(s),
        endTime: convert24to12(en),
        destination: document.getElementById("destination").value,
        purpose: document.getElementById("purpose").value,
        vehicleName,
        vehiclePlate,
        unit,
        projectTitle: unit === "Project" ? projectTitle : "",
        agencyFunder: unit === "Project" ? agencyFunder : "",
        remarks: document.getElementById("remarks").value,
        passengers,
        mainRequestor: document.getElementById("mainRequestor").value,
        mainEmail: document.getElementById("mainEmail").value
      };

      showLoading();

      try {
        const url = new URL(GAS_URL);
        url.searchParams.set("action", "saveReservation");
        url.searchParams.set("body", JSON.stringify(data));
        const res  = await fetch(url.toString());
        const resp = await res.json();
        hideLoading();

        if (resp.error) {
          if (resp.isDuplicate) {
            showDuplicateError(resp.error);
          } else {
            showErrorModal("Error: " + resp.error);
          }
        } else {
          closeModal();
          document.getElementById("confirmationMessage").innerHTML = `
            <p class="confirm-title">Reservation submitted!</p>
            <p class="confirm-sub">Your reservation code is</p>
            <div class="confirm-code">${resp.code}</div>
            <p class="confirm-ref">A confirmation email has been sent. Keep this code for your reference.</p>`;
          document.getElementById("confirmationModal").classList.add("is-open");
        }
      } catch (err) {
        hideLoading();
        showErrorModal("Server error: " + err.message);
      }
    });
  </script>
</body>
